# Reverse proxy in front of the FastAPI container.
# Expects TLS certs at /etc/nginx/certs/{fullchain.pem,privkey.pem}
# and optional basic-auth file at /etc/nginx/htpasswd (htpasswd format).
#
# The app has NO built-in authentication. Prefer basic auth, VPN, or IP allowlists
# when exposing this publicly — all users share the same in-memory upload state.

upstream infrarisk_app {
    server app:8000;
    keepalive 16;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 110m;

    # Optional basic auth — comment out the two auth_* lines to disable
    auth_basic           "Infra Risk Analyzer";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        proxy_pass         http://infrarisk_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Hazard tile PNGs — allow browser caching briefly
        proxy_buffering on;
    }

    location /health {
        auth_basic off;
        proxy_pass http://infrarisk_app/health;
        access_log off;
    }
}
